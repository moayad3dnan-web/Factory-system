<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>شاشة عرض الخزائن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --walnut:#3b2a20;
    --walnut-dark:#1a120c;
    --oak:#c79a63;
    --oak-light:#e4cda3;
    --safety:#d9622b;
    --ok:#3f7a45;
    --ok-light:#9fd6a3;
    --bad:#a5342a;
    --idle:#4a3b2d;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:var(--walnut-dark);
    color:#fff;
    font-family:'Tajawal',sans-serif;
    height:100%;
    overflow:hidden;
  }
  .stage{
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px;
    background:var(--idle);
    transition:background .35s ease;
  }
  .stage.ok{background:linear-gradient(160deg,var(--ok) 0%,#2c5c31 100%);}
  .stage.bad{background:linear-gradient(160deg,var(--bad) 0%,#7a241c 100%);}

  .top-label{
    position:absolute;
    top:28px;
    right:0; left:0;
    text-align:center;
    font-size:1rem;
    font-weight:700;
    color:rgba(255,255,255,0.55);
    letter-spacing:1px;
  }

  .icon{
    font-size:5.5vw;
    margin-bottom:1.2vw;
    opacity:0.9;
  }
  .label{
    font-size:2.4vw;
    font-weight:700;
    opacity:0.85;
    margin-bottom:0.6vw;
  }
  .value{
    font-size:9vw;
    font-weight:900;
    line-height:1.1;
    max-width:92vw;
    word-break:break-word;
  }
  .code{
    margin-top:1.6vw;
    font-family:'JetBrains Mono',monospace;
    font-size:1.6vw;
    opacity:0.7;
    letter-spacing:1px;
  }
  .time-ago{
    position:absolute;
    bottom:28px;
    right:0; left:0;
    text-align:center;
    font-size:0.95rem;
    color:rgba(255,255,255,0.5);
  }

  .conn-dot{
    position:absolute;
    top:28px;
    left:28px;
    width:12px; height:12px;
    border-radius:50%;
    background:#c0392b;
  }
  .conn-dot.on{background:#4b7a4f;}

  @keyframes pop{
    0%{ transform:scale(0.92); opacity:0.4; }
    60%{ transform:scale(1.03); opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }
  .pop{ animation:pop .35s ease; }
</style>
</head>
<body>
<div class="stage idle" id="stage">
  <div class="conn-dot" id="connDot"></div>
  <div class="top-label">شاشة تتبع صفائح الخشب</div>

  <div class="icon" id="icon">📦</div>
  <div class="label" id="label">بانتظار أول مسح...</div>
  <div class="value" id="value">—</div>
  <div class="code" id="code"></div>

  <div class="time-ago" id="timeAgo"></div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyASZzpHN3naZ3UxlRGS-VaDiNZV4-upmzA",
    authDomain: "professional-restaurant-system.firebaseapp.com",
    projectId: "professional-restaurant-system",
    storageBucket: "professional-restaurant-system.firebasestorage.app",
    messagingSenderId: "809714960687",
    appId: "1:809714960687:web:649fc13dd48972052139da",
    measurementId: "G-397FXE7298"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
</script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const stage = $('stage');
  let lastScannedAt = 0;

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function pulse(){
    stage.classList.remove('pop');
    void stage.offsetWidth; // restart animation
    stage.classList.add('pop');
  }

  db.collection('woodfactory_meta').doc('lastScan').onSnapshot(snap=>{
    $('connDot').classList.add('on');
    if(!snap.exists) return;
    const data = snap.data();
    if(!data || data.scannedAt === lastScannedAt) return;
    lastScannedAt = data.scannedAt;

    if(data.status === 'ok'){
      stage.className = 'stage ok';
      $('icon').textContent = '✅';
      $('label').textContent = 'هذا اللوح يخص';
      $('value').textContent = data.cabinetName || '';
      $('code').textContent = data.code || '';
    } else if(data.status === 'unknown_prefix'){
      stage.className = 'stage bad';
      $('icon').textContent = '⚠️';
      $('label').textContent = 'صيغة صحيحة لكن الخزانة غير مسجلة';
      $('value').textContent = 'بادئة ' + (data.prefix || '');
      $('code').textContent = data.code || '';
    } else if(data.status === 'ok_install'){
      stage.className = 'stage ok';
      $('icon').textContent = '📦';
      $('label').textContent = 'تركيبة';
      $('value').textContent = data.installName || '';
      $('code').textContent = data.code || '';
    } else if(data.status === 'unknown_install'){
      stage.className = 'stage bad';
      $('icon').textContent = '⚠️';
      $('label').textContent = 'تركيبة غير مسجلة';
      $('value').textContent = data.code || '—';
      $('code').textContent = '';
    } else {
      stage.className = 'stage bad';
      $('icon').textContent = '❌';
      $('label').textContent = 'كود غير معروف';
      $('value').textContent = data.code || '—';
      $('code').textContent = '';
    }
    pulse();
  }, err=>{
    console.error(err);
    $('connDot').classList.remove('on');
  });

  function tickTimeAgo(){
    if(!lastScannedAt){ $('timeAgo').textContent=''; return; }
    const secs = Math.floor((Date.now() - lastScannedAt)/1000);
    let txt;
    if(secs < 5) txt = 'الآن';
    else if(secs < 60) txt = 'قبل ' + secs + ' ثانية';
    else txt = 'قبل ' + Math.floor(secs/60) + ' دقيقة';
    $('timeAgo').textContent = 'آخر مسح: ' + txt;
  }
  setInterval(tickTimeAgo, 1000);
})();
</script>
</body>
</html>
