<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ماسح الخزائن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --walnut:#3b2a20;
    --walnut-dark:#1a120c;
    --oak:#c79a63;
    --oak-light:#e4cda3;
    --safety:#d9622b;
    --safety-dark:#b84e1f;
    --ok:#4b7a4f;
    --ok-light:#9fd6a3;
    --bad:#c0392b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;
    background:var(--walnut-dark);
    color:#fff;
    font-family:'Tajawal',sans-serif;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
  }
  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
  }

  header{
    padding:14px 16px calc(10px + env(safe-area-inset-top)) 16px;
    background:var(--walnut);
    text-align:center;
    flex-shrink:0;
  }
  header h1{
    margin:0;
    font-size:1.15rem;
    font-weight:900;
    color:var(--oak-light);
  }
  header .sub{
    font-size:0.72rem;
    color:var(--oak);
    margin-top:2px;
  }

  .cam-wrap{
    position:relative;
    flex:1;
    min-height:0;
    background:#000;
    overflow:hidden;
  }
  video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .scan-frame{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:78%;
    max-width:420px;
    aspect-ratio:2.2/1;
    border:3px solid var(--safety);
    border-radius:12px;
    box-shadow:0 0 0 2000px rgba(0,0,0,0.45);
    pointer-events:none;
  }
  .scan-frame::before, .scan-frame::after{
    content:"";
    position:absolute;
    width:26px; height:26px;
    border-color:#fff;
  }
  .cam-hint{
    position:absolute;
    bottom:14px; left:0; right:0;
    text-align:center;
    font-size:0.8rem;
    color:#fff;
    opacity:0.85;
    text-shadow:0 1px 3px rgba(0,0,0,0.6);
  }
  .cam-off{
    display:none;
    position:absolute;
    inset:0;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:14px;
    text-align:center;
    padding:24px;
    color:var(--oak-light);
  }
  .cam-off.show{display:flex;}
  .cam-off .icon{font-size:2.4rem;}
  .cam-off p{margin:0; font-size:0.92rem; line-height:1.7;}
  button.retry{
    border:none;
    background:var(--safety);
    color:#fff;
    font-family:inherit;
    font-weight:700;
    font-size:0.9rem;
    padding:11px 22px;
    border-radius:24px;
    cursor:pointer;
  }

  .result-panel{
    flex-shrink:0;
    padding:18px 16px calc(16px + env(safe-area-inset-bottom)) 16px;
    background:var(--walnut);
    min-height:108px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    transition:background .2s;
  }
  .result-panel.ok{background:var(--ok);}
  .result-panel.bad{background:var(--bad);}
  .result-panel .r-label{
    font-size:0.78rem;
    font-weight:700;
    opacity:0.85;
  }
  .result-panel .r-value{
    font-size:1.7rem;
    font-weight:900;
    line-height:1.3;
  }
  .result-panel .r-code{
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;
    opacity:0.75;
    margin-top:2px;
  }
  .result-panel.idle .r-label{opacity:0.6;}

  .manual-toggle{
    position:absolute;
    top:calc(12px + env(safe-area-inset-top));
    left:12px;
    background:rgba(0,0,0,0.5);
    border:1px solid rgba(255,255,255,0.3);
    color:#fff;
    font-family:inherit;
    font-size:0.75rem;
    padding:7px 12px;
    border-radius:20px;
    cursor:pointer;
  }
  .manual-box{
    display:none;
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    background:rgba(20,14,10,0.96);
    z-index:20;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .manual-box.show{display:flex;}
  .manual-inner{width:100%; max-width:360px; text-align:center;}
  .manual-inner label{
    display:block;
    font-size:0.85rem;
    color:var(--oak-light);
    margin-bottom:10px;
  }
  .manual-inner input{
    width:100%;
    padding:14px;
    font-size:1.1rem;
    font-family:'JetBrains Mono',monospace;
    text-align:center;
    border:2px solid var(--oak);
    border-radius:8px;
    background:#fff;
    color:var(--ink,#241b14);
    outline:none;
    margin-bottom:14px;
  }
  .manual-inner .row{display:flex; gap:10px;}
  .manual-inner button{
    flex:1;
    border:none;
    padding:12px;
    border-radius:8px;
    font-family:inherit;
    font-weight:700;
    font-size:0.9rem;
    cursor:pointer;
  }
  .manual-inner .go{background:var(--safety); color:#fff;}
  .manual-inner .close{background:transparent; color:var(--oak-light); border:1.5px solid var(--oak);}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>ماسح مواقع الألواح</h1>
    <div class="sub">وجّه الكاميرا نحو الباركود</div>
  </header>

  <div class="cam-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div class="scan-frame"></div>
    <div class="cam-hint">امسح باركود اللوح</div>
    <button class="manual-toggle" id="manualToggleBtn">إدخال يدوي</button>

    <div class="cam-off" id="camOff">
      <div class="icon">📷</div>
      <p id="camOffMsg">تعذر تشغيل الكاميرا. تأكد من إعطاء إذن الوصول للكاميرا من إعدادات المتصفح.</p>
      <button class="retry" id="retryBtn">إعادة المحاولة</button>
    </div>

    <div class="manual-box" id="manualBox">
      <div class="manual-inner">
        <label for="manualInput">أدخل كود اللوح يدويًا</label>
        <input type="text" id="manualInput" placeholder="LWD-01-XXXXX" autocomplete="off">
        <div class="row">
          <button class="go" id="manualGoBtn">تحقق</button>
          <button class="close" id="manualCloseBtn">إغلاق</button>
        </div>
      </div>
    </div>
  </div>

  <div class="result-panel idle" id="resultPanel">
    <div class="r-label">جاهز للمسح</div>
    <div class="r-value">—</div>
  </div>
</div>

<script>
(function(){
  const SHARED = true;
  let cabinets = [];
  let lastCode = '';
  let lastTime = 0;
  let detecting = false;
  let stream = null;
  let detector = null;
  let rafId = null;

  const $ = id => document.getElementById(id);
  const video = $('video');
  const panel = $('resultPanel');

  async function loadCabinets(){
    try{
      const c = await window.storage.get('cabinets', SHARED);
      cabinets = c ? JSON.parse(c.value) : [];
    }catch(e){ cabinets = []; }
  }
  // refresh cabinet list periodically so new cabinets added on the admin device show up
  loadCabinets();
  setInterval(loadCabinets, 15000);

  function showResult(code){
    const match = code.match(/^LWD-(\d{2})-/i);
    if(match){
      const prefix = match[1];
      const cab = cabinets.find(c=>c.prefix===prefix);
      if(cab){
        panel.className = 'result-panel ok';
        panel.innerHTML = `<div class="r-label">هذا اللوح يخص</div><div class="r-value">${escapeHtml(cab.name)}</div><div class="r-code">${escapeHtml(code)}</div>`;
        return;
      }
      panel.className = 'result-panel bad';
      panel.innerHTML = `<div class="r-label">صيغة صحيحة لكن الخزانة غير مسجلة</div><div class="r-value">بادئة ${escapeHtml(prefix)}</div>`;
      return;
    }
    panel.className = 'result-panel bad';
    panel.innerHTML = `<div class="r-label">غير معروف</div><div class="r-value">الكود لا يطابق صيغة النظام</div>`;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function handleDetected(code){
    const now = Date.now();
    if(code === lastCode && now - lastTime < 2500) return; // debounce repeats
    lastCode = code;
    lastTime = now;
    if(navigator.vibrate) navigator.vibrate(80);
    showResult(code);
  }

  async function startCamera(){
    $('camOff').classList.remove('show');
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
    }catch(err){
      console.error(err);
      $('camOffMsg').textContent = 'تعذر تشغيل الكاميرا: ' + (err.message || 'تحقق من الأذونات');
      $('camOff').classList.add('show');
      return;
    }

    if('BarcodeDetector' in window){
      try{
        const formats = await BarcodeDetector.getSupportedFormats();
        const use = formats.includes('code_128') ? ['code_128'] : formats;
        detector = new BarcodeDetector({ formats: use });
        detecting = true;
        scanLoop();
      }catch(err){
        console.error(err);
        fallbackNoDetector();
      }
    } else {
      fallbackNoDetector();
    }
  }

  function fallbackNoDetector(){
    $('camOffMsg').textContent = 'هذا المتصفح لا يدعم قراءة الباركود تلقائيًا من الكاميرا. استخدم الإدخال اليدوي بالأعلى.';
    $('camOff').classList.add('show');
  }

  async function scanLoop(){
    if(!detecting) return;
    try{
      const codes = await detector.detect(video);
      if(codes && codes.length > 0){
        handleDetected(codes[0].rawValue);
      }
    }catch(err){
      // detection errors on individual frames are common (blur, etc.) — ignore and keep trying
    }
    rafId = requestAnimationFrame(scanLoop);
  }

  function stopCamera(){
    detecting = false;
    if(rafId) cancelAnimationFrame(rafId);
    if(stream){
      stream.getTracks().forEach(t=>t.stop());
      stream = null;
    }
  }

  $('retryBtn').addEventListener('click', startCamera);

  // manual entry
  $('manualToggleBtn').addEventListener('click', ()=>{
    $('manualBox').classList.add('show');
    setTimeout(()=>$('manualInput').focus(), 50);
  });
  $('manualCloseBtn').addEventListener('click', ()=>{
    $('manualBox').classList.remove('show');
  });
  $('manualGoBtn').addEventListener('click', submitManual);
  $('manualInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter') submitManual();
  });
  function submitManual(){
    const val = $('manualInput').value.trim();
    if(!val) return;
    handleDetected(val);
    $('manualBox').classList.remove('show');
    $('manualInput').value = '';
  }

  window.addEventListener('beforeunload', stopCamera);
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden) stopCamera();
    else if(!stream) startCamera();
  });

  startCamera();
})();
</script>
</body>
</html>
