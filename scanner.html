<style>
  :root{
    --walnut:#3b2a20;
    --walnut-dark:#1a120c;
    --oak:#c79a63;
    --oak-light:#e4cda3;
    --safety:#d9622b;
    --safety-dark:#b84e1f;
    --ok:#4b7a4f;
    --bad:#c0392b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;
    background:var(--walnut-dark);
    color:#fff;
    font-family:'Tajawal',sans-serif;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
  }
  .app{display:flex; flex-direction:column; height:100vh; height:100dvh;}

  header{
    padding:14px 16px calc(10px + env(safe-area-inset-top)) 16px;
    background:var(--walnut);
    text-align:center;
    flex-shrink:0;
  }
  header h1{margin:0; font-size:1.15rem; font-weight:900; color:var(--oak-light);}
  header .sub{font-size:0.72rem; color:var(--oak); margin-top:2px;}
  header .conn{
    display:inline-block;
    margin-top:6px;
    font-size:0.68rem;
    padding:3px 10px;
    border-radius:12px;
    font-weight:700;
  }
  header .conn.on{background:rgba(75,122,79,0.35); color:#bfe3c2;}
  header .conn.off{background:rgba(192,57,43,0.35); color:#f3c2bc;}

  .cam-wrap{position:relative; flex:1; min-height:0; background:#000; overflow:hidden;}
  video{width:100%; height:100%; object-fit:cover; display:block;}
  canvas#scanCanvas{display:none;}
  .scan-frame{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:78%; max-width:420px; aspect-ratio:2.2/1;
    border:3px solid var(--safety); border-radius:12px;
    box-shadow:0 0 0 2000px rgba(0,0,0,0.45);
    pointer-events:none;
  }
  .cam-hint{
    position:absolute; bottom:14px; left:0; right:0; text-align:center;
    font-size:0.8rem; color:#fff; opacity:0.85; text-shadow:0 1px 3px rgba(0,0,0,0.6);
  }
  .cam-off{
    display:none; position:absolute; inset:0; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; text-align:center; padding:24px; color:var(--oak-light);
    z-index:10;
  }
  .cam-off.show{display:flex;}
  .cam-off .icon{font-size:2.4rem;}
  .cam-off p{margin:0; font-size:0.92rem; line-height:1.7;}
  button.retry{
    border:none; background:var(--safety); color:#fff; font-family:inherit;
    font-weight:700; font-size:0.9rem; padding:11px 22px; border-radius:24px; cursor:pointer;
  }

  .result-panel{
    flex-shrink:0;
    padding:18px 16px calc(16px + env(safe-area-inset-bottom)) 16px;
    background:var(--walnut);
    min-height:108px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    transition:background .2s;
  }
  .result-panel.ok{background:var(--ok);}
  .result-panel.bad{background:var(--bad);}
  .result-panel .r-label{font-size:0.78rem; font-weight:700; opacity:0.85;}
  .result-panel .r-value{font-size:1.7rem; font-weight:900; line-height:1.3;}
  .result-panel .r-code{font-family:'JetBrains Mono',monospace; font-size:0.72rem; opacity:0.75; margin-top:2px;}
  .result-panel.idle .r-label{opacity:0.6;}

  .manual-toggle{
    position:absolute; top:calc(12px + env(safe-area-inset-top)); left:12px;
    background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.3); color:#fff;
    font-family:inherit; font-size:0.75rem; padding:7px 12px; border-radius:20px; cursor:pointer;
    z-index:25;
  }
  .manual-box{
    display:none; position:absolute; inset:0; background:rgba(20,14,10,0.96); z-index:30;
    align-items:center; justify-content:center; padding:24px;
  }
  .manual-box.show{display:flex;}
  .manual-inner{width:100%; max-width:360px; text-align:center;}
  .manual-inner label{display:block; font-size:0.85rem; color:var(--oak-light); margin-bottom:10px;}
  .manual-inner input{
    width:100%; padding:14px; font-size:1.1rem; font-family:'JetBrains Mono',monospace;
    text-align:center; border:2px solid var(--oak); border-radius:8px; background:#fff;
    color:#241b14; outline:none; margin-bottom:14px;
  }
  .manual-inner .row{display:flex; gap:10px;}
  .manual-inner button{
    flex:1; border:none; padding:12px; border-radius:8px; font-family:inherit;
    font-weight:700; font-size:0.9rem; cursor:pointer;
  }
  #quaggaTarget video, #quaggaTarget canvas{
    width:100% !important; height:100% !important;
    object-fit:cover;
    position:absolute; top:0; left:0;
  }
  .manual-inner .go{background:var(--safety); color:#fff;}
  .manual-inner .close{background:transparent; color:var(--oak-light); border:1.5px solid var(--oak);}

  .cabin-print{ display:none; }
  @media print{
    body > *:not(.cabin-print){ display:none !important; }
    .cabin-print{
      display:block !important;
      position:static;
      color:#000;
      font-family:'Tajawal',sans-serif;
      padding:16px;
    }
    .cp-card{
      border:2px solid #000;
      border-radius:6px;
      overflow:hidden;
      max-width:620px;
      margin:0 auto;
    }
    .cp-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px 16px;
      border-bottom:2px solid #000;
      background:#f2f2f2;
    }
    .cp-top .cp-brand{ font-weight:900; font-size:1.05rem; }
    .cp-top .cp-name{ font-weight:900; font-size:1.15rem; }
    .cp-codes{
      display:flex;
      align-items:center;
      justify-content:space-around;
      gap:16px;
      padding:16px;
      border-bottom:2px solid #000;
    }
    .cp-code-block{ text-align:center; }
    .cp-code-block svg{ display:block; margin:0 auto; }
    .cp-code-block .cp-code-label{ font-size:0.72rem; color:#555; margin-top:4px; }
    #cpBarcodeSvg{ height:60px; }
    #cpQrHolder svg{ width:110px; height:110px; }
    .cp-code-text{
      text-align:center;
      font-family:'JetBrains Mono',monospace;
      font-size:0.8rem;
      padding:6px 0;
      border-bottom:2px solid #000;
      letter-spacing:1px;
    }
    table.cp-specs{ width:100%; border-collapse:collapse; }
    table.cp-specs td{ border:1px solid #999; padding:8px 12px; font-size:0.95rem; }
    table.cp-specs td.k{ font-weight:700; background:#eee; width:35%; }
    .cp-files{ padding:12px 16px; border-top:2px solid #000; }
    .cp-files h3{ font-size:0.9rem; margin:0 0 8px; }
    .cp-files ul{ margin:0; padding-inline-start:20px; font-size:0.85rem; }
    .cp-files li{ margin-bottom:4px; word-break:break-all; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>ماسح مواقع الألواح</h1>
    <div class="sub">وجّه الكاميرا نحو الباركود</div>
    <div class="conn off" id="connBadge">جاري الاتصال...</div>
    <div class="conn off" id="debugBadge" style="margin-right:6px;">—</div>
  </header>

  <div class="cam-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="quaggaTarget" style="position:absolute;inset:0;display:none;"></div>
    <canvas id="scanCanvas"></canvas>
    <div class="scan-frame"></div>
    <div class="cam-hint">امسح باركود اللوح</div>
    <button class="manual-toggle" id="manualToggleBtn">إدخال يدوي</button>

    <div class="cam-off" id="camOff">
      <div class="icon">📷</div>
      <p id="camOffMsg">تعذر تشغيل الكاميرا. تأكد من إعطاء إذن الوصول للكاميرا من إعدادات المتصفح.</p>
      <button class="retry" id="retryBtn">إعادة المحاولة</button>
    </div>

    <div class="manual-box" id="manualBox">
      <div class="manual-inner">
        <label for="manualCodeInput">خانة الكود (باركود اللوح/الكبينة)</label>
        <input type="text" id="manualCodeInput" placeholder="LWD-01-XXXXX" autocomplete="off">
        <div class="row" style="margin-bottom:16px;">
          <button class="go" id="manualCodeGoBtn">تحقق</button>
        </div>

        <label for="manualQrInput">خانة QR (كود التركيبة)</label>
        <input type="text" id="manualQrInput" placeholder="INST-XXXXX" autocomplete="off">
        <div class="row">
          <button class="go" id="manualQrGoBtn">تحقق</button>
        </div>

        <div class="row" style="margin-top:14px;">
          <button class="close" id="manualCloseBtn" style="flex:1;">إغلاق</button>
        </div>
      </div>
    </div>
  </div>

  <div class="result-panel idle" id="resultPanel">
    <div class="r-label">جاهز للمسح</div>
    <div class="r-value">—</div>
  </div>
</div>

<div class="cabin-print" id="cabinPrint">
  <div class="cp-card">
    <div class="cp-top">
      <div class="cp-brand">مصنع الخشب</div>
      <div class="cp-name" id="cpName"></div>
    </div>
    <div class="cp-codes">
      <div class="cp-code-block">
        <svg id="cpBarcodeSvg"></svg>
        <div class="cp-code-label">باركود</div>
      </div>
      <div class="cp-code-block">
        <div id="cpQrHolder"></div>
        <div class="cp-code-label">QR</div>
      </div>
    </div>
    <div class="cp-code-text" id="cpCode"></div>
    <table class="cp-specs" id="cpSpecsTable"></table>
    <div class="cp-files" id="cpFilesSection" style="display:none;">
      <h3>ملفات مرفقة</h3>
      <ul id="cpFilesList"></ul>
    </div>
  </div>
</div>

<script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyASZzpHN3naZ3UxlRGS-VaDiNZV4-upmzA",
    authDomain: "professional-restaurant-system.firebaseapp.com",
    projectId: "professional-restaurant-system",
    storageBucket: "professional-restaurant-system.firebasestorage.app",
    messagingSenderId: "809714960687",
    appId: "1:809714960687:web:649fc13dd48972052139da",
    measurementId: "G-397FXE7298"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
</script>

<script>
(function(){
  let cabinets = [];
  let lastCode = '';
  let lastTime = 0;
  let stream = null;
  let usingQuagga = false;
  let quaggaLoaded = false;
  let jsQrLoaded = false;

  const $ = id => document.getElementById(id);
  const video = $('video');
  const panel = $('resultPanel');

  // ---- Firestore realtime cabinets sync ----
  db.collection('woodfactory_cabinets').onSnapshot(snap=>{
    cabinets = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    $('connBadge').textContent = 'متصل — ' + cabinets.length + ' خزانة';
    $('connBadge').className = 'conn on';
  }, err=>{
    console.error(err);
    $('connBadge').textContent = 'تعذر الاتصال بقاعدة البيانات';
    $('connBadge').className = 'conn off';
  });

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function showResult(code){
    const cabMatch = code.match(/^LWD-(\d{2})-/i);
    if(cabMatch){
      const prefix = cabMatch[1];
      const cab = cabinets.find(c=>c.prefix===prefix);
      if(cab){
        panel.className = 'result-panel ok';
        panel.innerHTML = `<div class="r-label">تم المسح ✅</div><div class="r-value">راجع شاشة العرض</div>`;
        pushLastScan({ code, status:'ok', cabinetId: cab.id, cabinetName: cab.name, prefix });
        return;
      }
      panel.className = 'result-panel bad';
      panel.innerHTML = `<div class="r-label">خطأ ❌</div><div class="r-value">راجع شاشة العرض</div>`;
      pushLastScan({ code, status:'unknown_prefix', prefix });
      return;
    }

    if(/^INST-/i.test(code)){
      lookupInstallation(code);
      return;
    }

    if(/^KBN-/i.test(code)){
      lookupCabinAndPrint(code);
      return;
    }

    panel.className = 'result-panel bad';
    panel.innerHTML = `<div class="r-label">غير معروف</div><div class="r-value">الكود لا يطابق صيغة النظام</div>`;
    pushLastScan({ code, status:'invalid' });
  }

  async function lookupCabinAndPrint(code){
    panel.className = 'result-panel idle';
    panel.innerHTML = `<div class="r-label">جاري البحث...</div><div class="r-value">${escapeHtml(code)}</div>`;
    try{
      const snap = await db.collection('woodfactory_cabins').where('code','==',code).limit(1).get();
      if(snap.empty){
        panel.className = 'result-panel bad';
        panel.innerHTML = `<div class="r-label">خطأ ❌</div><div class="r-value">كبينة غير مسجلة</div>`;
        return;
      }
      const d = snap.docs[0].data();
      panel.className = 'result-panel ok';
      panel.innerHTML = `<div class="r-label">تم المسح ✅</div><div class="r-value">جاري الطباعة...</div>`;
      printCabinSheet(code, d);
    }catch(err){
      console.error(err);
      panel.className = 'result-panel bad';
      panel.innerHTML = `<div class="r-label">تعذر البحث</div><div class="r-value">${escapeHtml(err.message)}</div>`;
    }
  }

  function printCabinSheet(code, d){
    $('cpName').textContent = d.name || 'كبينة';
    $('cpCode').textContent = code;

    if(typeof JsBarcode !== 'undefined'){
      try{
        JsBarcode($('cpBarcodeSvg'), code, {
          format:'CODE128', width:2, height:60, displayValue:false, margin:4
        });
      }catch(err){ console.error(err); }
    }

    if(typeof qrcode !== 'undefined'){
      try{
        const viewUrl = new URL('view.html', window.location.href).href + '?code=' + encodeURIComponent(code);
        const qr = qrcode(0, 'M');
        qr.addData(viewUrl);
        qr.make();
        $('cpQrHolder').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2 });
      }catch(err){ console.error(err); }
    }

    const table = $('cpSpecsTable');
    table.innerHTML = '';
    (d.specs || []).forEach(s=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="k">${escapeHtml(s.key)}</td><td>${escapeHtml(s.value)}</td>`;
      table.appendChild(tr);
    });

    const files = d.files || [];
    const filesSection = $('cpFilesSection');
    const filesList = $('cpFilesList');
    filesList.innerHTML = '';
    if(files.length > 0){
      filesSection.style.display = 'block';
      files.forEach(f=>{
        const li = document.createElement('li');
        li.textContent = `${f.name || 'ملف'} — ${f.url}`;
        filesList.appendChild(li);
      });
    } else {
      filesSection.style.display = 'none';
    }

    setTimeout(()=>{ window.print(); }, 200);
  }

  async function lookupInstallation(code){
    panel.className = 'result-panel idle';
    panel.innerHTML = `<div class="r-label">جاري البحث...</div><div class="r-value">${escapeHtml(code)}</div>`;
    try{
      const snap = await db.collection('woodfactory_installations').where('code','==',code).limit(1).get();
      if(snap.empty){
        panel.className = 'result-panel bad';
        panel.innerHTML = `<div class="r-label">خطأ ❌</div><div class="r-value">راجع شاشة العرض</div>`;
        pushLastScan({ code, status:'unknown_install' });
        return;
      }
      const d = snap.docs[0].data();
      panel.className = 'result-panel ok';
      panel.innerHTML = `<div class="r-label">تم المسح ✅</div><div class="r-value">راجع شاشة العرض</div>`;
      pushLastScan({ code, status:'ok_install', installName: d.name, files: d.files || [] });
    }catch(err){
      console.error(err);
      panel.className = 'result-panel bad';
      panel.innerHTML = `<div class="r-label">تعذر البحث</div><div class="r-value">${escapeHtml(err.message)}</div>`;
    }
  }

  function pushLastScan(data){
    db.collection('woodfactory_meta').doc('lastScan').set({
      ...data,
      scannedAt: Date.now()
    }).catch(err=>console.error('pushLastScan failed', err));
  }

  function extractCode(raw){
    const text = (raw || '').trim();
    // if a QR encodes a URL like view.html?code=KBN-XXXX, pull out the real code
    try{
      const url = new URL(text);
      const inner = url.searchParams.get('code');
      if(inner) return inner;
    }catch(e){ /* not a URL, use as-is */ }
    return text;
  }

  function handleDetected(rawCode){
    const code = extractCode(rawCode);
    const now = Date.now();
    if(code === lastCode && now - lastTime < 2500) return;
    lastCode = code;
    lastTime = now;
    if(navigator.vibrate) navigator.vibrate(80);
    showResult(code);
  }

  // ---- camera + scanning ----
  let detector = null;
  let rafId = null;
  let detecting = false;
  let cameraActive = false;

  function cameraErrorMessage(err){
    const name = err && err.name;
    if(name === 'NotAllowedError' || name === 'PermissionDeniedError'){
      return 'إذن الكاميرا مرفوض. جرّب: (١) تطبيق الإعدادات ← اسم المتصفح (Safari/Chrome...) ← Camera ← Allow، أو (٢) اضغط أيقونة القفل/المعلومات يسار شريط العنوان ← Site Settings ← Camera ← Allow. بعدها أعد تحميل الصفحة. أو استخدم الإدخال اليدوي بالأعلى.';
    }
    if(name === 'NotFoundError'){
      return 'ما فيه كاميرا متاحة على هذا الجهاز. استخدم الإدخال اليدوي بالأعلى.';
    }
    return 'تعذر تشغيل الكاميرا: ' + (err && err.message ? err.message : 'خطأ غير معروف') + '. استخدم الإدخال اليدوي بالأعلى.';
  }

  async function startCamera(){
    $('camOff').classList.remove('show');

    let hasDetector = false;
    if('BarcodeDetector' in window){
      try{
        const formats = await BarcodeDetector.getSupportedFormats();
        const wanted = ['code_128', 'qr_code'].filter(f => formats.includes(f));
        const use = wanted.length ? wanted : formats;
        $('debugBadge').textContent = 'مدمج | صيغ: ' + formats.join(',') + ' | مستخدمة: ' + use.join(',');
        $('debugBadge').classList.add('on');
        if(use.length){
          detector = new BarcodeDetector({ formats: use });
          hasDetector = true;
        }
      }catch(err){
        console.error('BarcodeDetector unsupported', err);
        $('debugBadge').textContent = 'مدمج فشل: ' + err.message;
      }
    } else {
      $('debugBadge').textContent = 'لا يوجد BarcodeDetector بالمتصفح';
    }

    if(hasDetector){
      video.style.display = 'block';
      $('quaggaTarget').style.display = 'none';
      try{
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
      }catch(err){
        console.error(err);
        $('camOffMsg').textContent = cameraErrorMessage(err);
        $('camOff').classList.add('show');
        return;
      }
      detecting = true;
      cameraActive = true;
      scanLoopNative();
    } else {
      video.style.display = 'none';
      $('quaggaTarget').style.display = 'block';
      loadQuaggaThenStart();
    }
  }

  async function scanLoopNative(){
    if(!detecting) return;
    try{
      const codes = await detector.detect(video);
      if(codes && codes.length > 0) handleDetected(codes[0].rawValue);
    }catch(err){ /* ignore per-frame errors */ }
    rafId = requestAnimationFrame(scanLoopNative);
  }

  // ---- Quagga fallback (cascading CDNs) for browsers without BarcodeDetector ----
  function loadScript(src){
    return new Promise((resolve, reject)=>{
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  async function loadQuaggaThenStart(){
    $('debugBadge').textContent = 'وضع احتياطي (Quagga+jsQR) | jsQR: جاري التحميل...';
    $('debugBadge').classList.add('on');
    // load jsQR in parallel (best-effort, doesn't block barcode scanning if it fails)
    if(!jsQrLoaded){
      loadScript('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js')
        .then(()=>{
          jsQrLoaded = true;
          $('debugBadge').textContent = 'وضع احتياطي (Quagga+jsQR) | jsQR: تم التحميل ✅';
        })
        .catch(()=>{
          loadScript('https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js')
            .then(()=>{
              jsQrLoaded = true;
              $('debugBadge').textContent = 'وضع احتياطي (Quagga+jsQR) | jsQR: تم التحميل من مصدر ثاني ✅';
            })
            .catch(()=>{
              console.error('jsQR failed to load from both CDNs');
              $('debugBadge').textContent = 'وضع احتياطي | jsQR: فشل التحميل ❌ (باركود فقط يشتغل)';
            });
        });
    }

    if(quaggaLoaded){ startQuagga(); return; }
    try{
      await loadScript('https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js');
      quaggaLoaded = true;
      startQuagga();
    }catch(e1){
      try{
        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js');
        quaggaLoaded = true;
        startQuagga();
      }catch(e2){
        $('camOffMsg').textContent = 'تعذر تحميل مكتبة قراءة الباركود (تحقق من الإنترنت). استخدم الإدخال اليدوي بالأعلى.';
        $('camOff').classList.add('show');
      }
    }
  }

  // ---- parallel QR scan loop (jsQR) alongside Quagga's barcode loop ----
  let qrScanCanvas = null, qrScanCtx = null, qrLoopId = null;
  function startQrLoop(){
    if(!qrScanCanvas){
      qrScanCanvas = document.createElement('canvas');
      qrScanCtx = qrScanCanvas.getContext('2d', { willReadFrequently: true });
    }
    function tick(){
      if(!usingQuagga){ return; } // stop loop once camera stops
      const quaggaVideoEl = document.querySelector('#quaggaTarget video');
      if(typeof jsQR !== 'undefined' && quaggaVideoEl && quaggaVideoEl.videoWidth > 0){
        qrScanCanvas.width = quaggaVideoEl.videoWidth;
        qrScanCanvas.height = quaggaVideoEl.videoHeight;
        qrScanCtx.drawImage(quaggaVideoEl, 0, 0, qrScanCanvas.width, qrScanCanvas.height);
        try{
          const imgData = qrScanCtx.getImageData(0, 0, qrScanCanvas.width, qrScanCanvas.height);
          const result = jsQR(imgData.data, imgData.width, imgData.height);
          if(result && result.data) handleDetected(result.data);
        }catch(err){ /* ignore per-frame errors */ }
      }
      qrLoopId = requestAnimationFrame(tick);
    }
    qrLoopId = requestAnimationFrame(tick);
  }

  function startQuagga(){
    if(typeof Quagga === 'undefined'){
      $('camOffMsg').textContent = 'تعذر تحميل مكتبة قراءة الباركود. استخدم الإدخال اليدوي بالأعلى.';
      $('camOff').classList.add('show');
      return;
    }
    usingQuagga = true;
    Quagga.init({
      inputStream: {
        name: 'Live',
        type: 'LiveStream',
        target: document.getElementById('quaggaTarget'),
        constraints: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
      },
      decoder: { readers: ['code_128_reader'] },
      locate: true
    }, err=>{
      if(err){
        console.error(err);
        $('camOffMsg').textContent = cameraErrorMessage(err);
        $('camOff').classList.add('show');
        return;
      }
      Quagga.start();
      cameraActive = true;
      startQrLoop();
      Quagga.onDetected(result=>{
        if(result && result.codeResult && result.codeResult.code){
          handleDetected(result.codeResult.code);
        }
      });
    });
  }

  function stopCamera(){
    detecting = false;
    if(rafId) cancelAnimationFrame(rafId);
    if(qrLoopId) cancelAnimationFrame(qrLoopId);
    if(usingQuagga && typeof Quagga !== 'undefined'){
      try{ Quagga.stop(); }catch(e){}
    }
    usingQuagga = false;
    if(stream){
      stream.getTracks().forEach(t=>t.stop());
      stream = null;
    }
    cameraActive = false;
  }

  $('retryBtn').addEventListener('click', ()=>{
    stopCamera();
    startCamera();
  });

  $('manualToggleBtn').addEventListener('click', ()=>{
    $('manualBox').classList.add('show');
    setTimeout(()=>$('manualCodeInput').focus(), 50);
  });
  $('manualCloseBtn').addEventListener('click', ()=>{
    $('manualBox').classList.remove('show');
  });

  function submitManualField(inputEl){
    const val = inputEl.value.trim();
    if(!val) return;
    handleDetected(val);
    $('manualBox').classList.remove('show');
    inputEl.value = '';
  }

  $('manualCodeGoBtn').addEventListener('click', ()=> submitManualField($('manualCodeInput')));
  $('manualCodeInput').addEventListener('keydown', e=>{ if(e.key === 'Enter') submitManualField($('manualCodeInput')); });

  $('manualQrGoBtn').addEventListener('click', ()=> submitManualField($('manualQrInput')));
  $('manualQrInput').addEventListener('keydown', e=>{ if(e.key === 'Enter') submitManualField($('manualQrInput')); });

  window.addEventListener('beforeunload', stopCamera);
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden) stopCamera();
    else if(!cameraActive) startCamera();
  });

  startCamera();
})();
</script>
</body>
</html>
